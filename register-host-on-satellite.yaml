---
- name: Register RHEL hosts to Red Hat Satellite
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Clean existing subscription-manager data
      command: subscription-manager clean

    - name: Verify bearer token exists
      shell: |
        if [ -z "$SATELLITE_BEARER" ]; then
          echo "Token is empty"
          exit 1
        else
          echo "Token exists"
        fi
      args:
        executable: /bin/bash
      register: bearer_check

    - name: Show bearer check result
      debug:
        var: bearer_check.stdout

    - name: Register host to Satellite
      shell: |
        set -o pipefail && \
        curl --silent --show-error --insecure \
        'https://satcdn.teneceocp.com/register?activation_keys=rhel10&download_utility=curl&location_id=2&organization_id=1&update_packages=false' \
        --header "Authorization: Bearer ${SATELLITE_BEARER}" | bash
      args:
        executable: /bin/bash
      register: registration

    - name: Show registration output
      debug:
        var: registration.stdout_lines
