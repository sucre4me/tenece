---
- name: Register RHEL hosts to Red Hat Satellite
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Clean existing subscription-manager data
      ansible.builtin.command: subscription-manager clean

    - name: Dynamically generate the registration command from Satellite
      redhat.satellite.registration_command:
        server_url: "{{ lookup('ansible.builtin.env', 'FOREMAN_SERVER_URL') }}"
        username: "{{ lookup('ansible.builtin.env', 'FOREMAN_USERNAME') }}"
        password: "{{ lookup('ansible.builtin.env', 'FOREMAN_PASSWORD') }}"
        validate_certs: true
        organization: "1"
        location: "2"
        activation_keys:
          - "rhel10"
      delegate_to: localhost
      become: false
      # This block preserves and passes the AAP credential vars to localhost:
      environment:
        FOREMAN_SERVER_URL: "{{ ansible_env.FOREMAN_SERVER_URL | default(lookup('ansible.builtin.env', 'FOREMAN_SERVER_URL')) }}"
        FOREMAN_USERNAME: "{{ ansible_env.FOREMAN_USERNAME | default(lookup('ansible.builtin.env', 'FOREMAN_USERNAME')) }}"
        FOREMAN_PASSWORD: "{{ ansible_env.FOREMAN_PASSWORD | default(lookup('ansible.builtin.env', 'FOREMAN_PASSWORD')) }}"
      register: sat_registration

    - name: Execute dynamic registration script on host
      ansible.builtin.shell:
        cmd: "{{ sat_registration.registration_command }}"
      args:
        executable: /bin/bash
      register: registration
      no_log: true

    - name: Show registration output
      ansible.builtin.debug:
        var: registration.stdout_lines
