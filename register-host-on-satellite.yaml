---
- name: Register RHEL hosts to Red Hat Satellite
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Clean existing subscription-manager data
      ansible.builtin.command: subscription-manager clean

    - name: Dynamically generate the registration command from Satellite
      redhat.satellite.registration_command:
        # DO NOT use lookups here. Leaving these out forces the module to 
        # naturally read the FOREMAN_ variables injected by your AAP credential.
        validate_certs: true
        organization: "1"
        location: "2"
        activation_keys:
          - "rhel10"
      delegate_to: localhost
      become: false
      register: sat_registration

    - name: Execute dynamic registration script on host
      ansible.builtin.shell:
        cmd: "{{ sat_registration.registration_command }}"
      args:
        executable: /bin/bash
      register: registration
      no_log: true

    - name: Show registration output
      ansible.builtin.debug:
        var: registration.stdout_lines
