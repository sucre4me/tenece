---
- name: Force Clean Purge of Notepad++
  hosts: windows
  gather_facts: false

  tasks:
    - name: 1. Uninstall parent wrapper first with dependencies flag
      chocolatey.chocolatey.win_chocolatey:
        name: notepadplusplus
        state: absent
        remove_dependencies: true

    - name: 2. Safely remove core install package (now unblocked)
      chocolatey.chocolatey.win_chocolatey:
        name: notepadplusplus.install
        state: absent

    - name: 3. Clean up native package if desynced
      ansible.windows.win_package:
        product_id: "Notepad++"
        state: absent

    - name: 4. Purge leftover application folders from disk
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - 'C:\Program Files\Notepad++'
        - 'C:\Program Files (x86)\Notepad++'

